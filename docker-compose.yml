services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: finance-agent-postgres
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: finance_agent
    ports:
      - "5432:5432"
    volumes:
      - ./init/pgvector.sql:/docker-entrypoint-initdb.d/pgvector.sql
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: finance-agent-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
