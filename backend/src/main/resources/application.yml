spring:
  application:
    name: finance-agent
  ai:
    openai:
      # 密钥通过环境变量注入，切勿写死在配置文件或源码中
      api-key: ${DASHSCOPE_API_KEY}
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      chat:
        options:
          model: qwen-plus
          temperature: 0.3

server:
  port: 8080
